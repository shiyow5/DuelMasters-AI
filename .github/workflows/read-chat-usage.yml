name: Read chat_daily_usage (read-only, one-off)

# 本番 DB の chat_daily_usage から、JST の 2026-11-15 / 2026-11-16 の AI 質問回数を「読むだけ」の使い捨て workflow。
#
# - 手動実行 (workflow_dispatch) のみ。inputs なし。push / schedule では動かない。
# - permissions: contents: read。checkout しない (リポジトリのコードは使わない)。
# - SQL は固定の SELECT 1本だけ。BEGIN READ ONLY → SHOW transaction_read_only が on であることを確認
#   (on 以外なら SELECT せず失敗) → SELECT → ROLLBACK。書き込み系の文は含まない。
# - 出すもの: 日ごとの集計値 (合計回数・利用ユーザー数) だけ。user_id やそのハッシュなど、
#   ユーザーごとの値・識別子は出さない (リポジトリが PUBLIC で、ログが誰でも読めるため)。
#   artifact / step summary / 外部送信もしない。
# - 0行の原因切り分け用に、件数 (RLS 適用後 / 統計値)・ロール分類 (postgres かそれ以外)・RLS 関連の真偽値だけを追加で出す。
# - 接続情報は ::add-mask:: で伏せる。set -x は使わない。エラー時は ERROR/FATAL 行だけ、ホスト/IP を伏せて出す。
#
# 1回実行して結果を確認したら、この workflow を削除する PR を出す (役目を終える)。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-chat-usage
  cancel-in-progress: false

jobs:
  read:
    name: read chat_daily_usage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 接続情報を伏せる
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL が無い"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ["DATABASE_URL"])
          vals = {u.hostname, u.username, u.password, u.netloc}
          if u.password:
              vals.add(unquote(u.password))
          if u.username:
              vals.add(unquote(u.username))
          if u.hostname and u.port:
              vals.add(f"{u.hostname}:{u.port}")
          for v in vals:
              if v and len(v) >= 3:
                  print(f"::add-mask::{v}")
          PY

      - name: 読み取り専用トランザクションで集計
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: "20"
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/psql.err"
          sql="$RUNNER_TEMP/read.sql"
          cat > "$sql" <<'SQL'
          BEGIN READ ONLY;
          SHOW transaction_read_only \gset
          \echo transaction_read_only=:transaction_read_only
          \if :transaction_read_only
          \else
            \echo READ ONLY になっていないので SELECT せず止める
            SELECT 1/0;
          \endif
          SELECT d.usage_date::text AS usage_date,
                 coalesce(sum(u.count), 0) AS day_total,
                 count(u.user_id) AS day_users
            FROM (VALUES (DATE '2026-11-15'), (DATE '2026-11-16')) AS d(usage_date)
            LEFT JOIN chat_daily_usage u ON u.usage_date = d.usage_date
           GROUP BY d.usage_date
           ORDER BY d.usage_date;
          -- 0行の切り分け用 (全部が集計値かロール名で、ユーザーごとの値は出さない)。
          -- visible_rows は RLS を通した後の件数。stats_live_tup は統計上の行数で RLS の影響を受けない。
          -- visible_rows=0 かつ stats_live_tup>0 なら RLS で見えていない。両方0ならテーブルが空。
          SELECT CASE WHEN current_user IN ('postgres') THEN current_user ELSE 'other' END AS role_class,
                 (SELECT count(*) FROM chat_daily_usage) AS visible_rows,
                 c.relrowsecurity AS rls_enabled,
                 c.relforcerowsecurity AS rls_forced,
                 pg_get_userbyid(c.relowner) = current_user AS is_owner,
                 r.rolsuper AS is_superuser,
                 r.rolbypassrls AS bypass_rls,
                 (SELECT count(*) FROM pg_policies p
                   WHERE p.schemaname = n.nspname AND p.tablename = c.relname) AS policy_count,
                 s.n_live_tup AS stats_live_tup,
                 c.reltuples::bigint AS reltuples
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_roles r ON r.rolname = current_user
            LEFT JOIN pg_stat_user_tables s ON s.relid = c.oid
           WHERE c.oid = 'chat_daily_usage'::regclass;
          ROLLBACK;
          SQL
          if ! psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -P footer=off -f "$sql" 2> "$err"; then
            echo "::error::DB への問い合わせに失敗 (接続情報は出さない)"
            grep -E '(ERROR|FATAL):' "$err" \
              | sed -E 's/"[^"]*"/"***"/g; s/\([0-9a-fA-F.:]+\)/(***)/g; s/[0-9]{1,3}(\.[0-9]{1,3}){3}/***/g' \
              | head -n 20 || true
            exit 1
          fi
