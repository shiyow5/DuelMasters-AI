name: Secrets default check (DATABASE_URL, one-off)

# GitHub Secret `DATABASE_URL` (repo レベル) が、開発用の既定値 (docker-compose.yml / README の接続情報)
# と同じか・含むかを、true / false / unknown だけで確認する使い捨ての workflow。
#
# - 手動実行 (workflow_dispatch) のみ。inputs なし。push / schedule では動かない。
# - DB には接続しない。Secret を env で受け、python3 で文字列として解析・比較するだけ。
# - 出す項目 (GITHUB_STEP_SUMMARY と通常ログの両方。値は true / false / unknown のみ):
#     pass_eq_default        パスワード (unquote 後) が既定値と完全一致
#     pass_contains_default  パスワード (unquote 後) が既定値 (パスワード・DB 名) を含む (大文字小文字無視)
#     user_eq_default        ユーザー名 (unquote 後) が既定値と完全一致
#     db_eq_default          DB 名 (path 先頭の / を除き unquote) が既定値と一致
#     host_is_local          ホストがローカル系 (loopback / compose のサービス名)
#     url_eq_default         URL 全体が開発既定 URL と一致 (前後空白除去後)
#     pass_empty             パスワードなし (None または空)
# - 判定結果では失敗させない。失敗するのは Secret が無いときだけ。
# - 判定ロジック: .github/scripts/secrets-default-check.py (テスト: test_secrets_default_check.py)。
#
# 接続情報をログに出さないための決まり:
# - set -x を使わない。DATABASE_URL を echo / printenv / env ダンプしない。
# - 値・長さ・ハッシュ・部分文字列・例外メッセージを出さない。解析失敗時は固定文言と unknown だけ。
# - 最初のステップ (checkout の直後) でホスト・ユーザー・パスワード等を ::add-mask:: する。
# - Issue 起票・artifact・外部送信・cache はしない。
#
# 結果を確認し終えたら、この workflow は役目を終える (削除してよい)。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-default-check
  cancel-in-progress: false

jobs:
  check:
    name: secrets default check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 接続情報を伏せる
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL が無い"
            exit 1
          fi
          # 例外時も traceback・例外の中身を出さない。取れる部分だけ mask する。
          python3 - <<'PY' || true
          import os
          from urllib.parse import urlsplit, unquote
          try:
              raw = os.environ["DATABASE_URL"]
              vals = set()
              try:
                  u = urlsplit(raw.strip())
                  host, user, pw, netloc = u.hostname, u.username, u.password, u.netloc
              except Exception:
                  host = user = pw = netloc = None
              vals.update({host, user, pw, netloc})
              if pw:
                  vals.add(unquote(pw))
              if user:
                  vals.add(unquote(user))
              try:
                  port = u.port
                  if host and port:
                      vals.add(f"{host}:{port}")
              except Exception:
                  pass
              for v in vals:
                  if v and len(v) >= 3:
                      print(f"::add-mask::{v}")
          except Exception:
              pass
          PY

      - name: 判定 (true / false / unknown だけ出す)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 .github/scripts/secrets-default-check.py
